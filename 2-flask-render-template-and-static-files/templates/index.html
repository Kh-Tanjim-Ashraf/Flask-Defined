{% extends 'base.html' %}

{% block title %}
    <title>Flask App - Render HTML & Static Files</title>
{% endblock %}

{% block stylesheet %}
    <!-- Link the stylesheet utilizing Jinja Template Engine -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    />
{% endblock %}

{% block content %}
    <h1>
        Flask App - Render HTML & CSS Files | Template Inheritance Utilizing Jinja Template Engine
    </h1>

    <p>Hello</p>
{% endblock %}
