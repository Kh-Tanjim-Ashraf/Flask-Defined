<!-- Task Insertion Form -->
<form method="post">
  {% if parentTemplate == "index" %}
  <!-- Task Insertion Form -->
  <div id="form-header">
    <h2>New Task Form</h2>
  </div>
  <div id="form-body">
    <div id="task-input">
      <input type="text" name="task" id="task" />
      <button type="submit" id="submit">+ Add</button>
    </div>
  </div>
  {% else %}
  <!-- Task Update Form -->
  <div id="form-header">
    <h2>Update Task Form</h2>
  </div>
  <div id="form-body">
    <div id="task-input">
      <!-- Task Content -->
      <input type="text" name="task" id="task" value="{{ task.content }}" />
      <!-- Task Status (Checkbox) -->
      <input type="checkbox" id="status" name="status" value={{ task.isCompleted }} 
        {% if task.isCompleted %}
        checked
        {% endif %}
        onclick="handleTaskCompleteStatus(this)"
      >
      <label for="status"> Completed</label>
    </div>
    <button type="submit" id="submit">✎ Update</button>
    <a href="/">↩ Go Back to Home</a>
  </div>
  {% endif %}
</form>
